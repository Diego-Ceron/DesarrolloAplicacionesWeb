<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestión de pacientes de Medicitas">
  <title>Pacientes | Medicitas</title>
  <link rel="stylesheet" href="../css/compartido/base.css">
  <link rel="stylesheet" href="../css/paginas/pacientes.css">
</head>
<body>
  <header class="patients-header">
    <a class="patients-header-brand" href="../index.html">Medicitas</a>

    <div class="patients-header-user">
      <span id="user-role"></span>
      <button id="theme-button" type="button" aria-label="Cambiar tema">
        Cambiar tema
      </button>
      <button id="logout-button" type="button">Cerrar sesión</button>
    </div>
  </header>

  <main class="patients-content">
    <header class="patients-content-header">
      <h1>Pacientes</h1>
      <p>Registra pacientes y guarda sus estudios, recetas y documentos.</p>
    </header>

    <p id="patients-message" class="patients-message" role="status" hidden></p>

    <div class="patients-layout">
      <div class="patients-side">
        <section id="form-section" class="patients-card" aria-labelledby="form-title">
          <h2 id="form-title">Nuevo paciente</h2>

          <form id="patient-form" class="patients-form" action="#" method="post">
            <input type="hidden" id="patient-id" name="patient_id">

            <div class="patients-field">
              <label for="first-name">Nombre(s)</label>
              <input type="text" id="first-name" name="first_name" autocomplete="off">
            </div>

            <div class="patients-field">
              <label for="last-name">Apellidos</label>
              <input type="text" id="last-name" name="last_name" autocomplete="off">
            </div>

            <div class="patients-field">
              <label for="phone">Teléfono</label>
              <input type="tel" id="phone" name="phone" maxlength="10" placeholder="10 dígitos">
            </div>

            <div class="patients-field">
              <label for="birth-date">Fecha de nacimiento</label>
              <input type="date" id="birth-date" name="birth_date">
            </div>

            <div class="patients-field">
              <label for="email">Correo electrónico</label>
              <input type="email" id="email" name="email" autocomplete="off">
            </div>

            <div class="patients-actions">
              <button type="submit">Guardar</button>
              <button type="reset" class="patients-button-secondary">Borrar</button>
            </div>
          </form>
        </section>

        <section class="patients-card" aria-labelledby="files-title">
          <h2 id="files-title">Archivos</h2>
          <p id="files-hint">Selecciona un paciente para ver sus archivos.</p>

          <div id="files-panel" hidden>
            <p>Paciente: <strong id="files-patient-name"></strong></p>

            <div id="upload-section">
              <label for="file-input" id="drop-zone" class="patients-drop-zone">
                Arrastra un archivo aquí o haz clic
                <small>PDF, JPG o PNG, máximo 2 MB</small>
              </label>
              <input type="file" id="file-input" name="file" accept=".pdf,.jpg,.jpeg,.png" hidden>
              <p id="file-error" class="patients-error"></p>
              <div id="file-preview"></div>
              <button type="button" id="upload-button" disabled>Subir archivo</button>
            </div>

            <ul id="files-list" class="patients-files"></ul>
          </div>
        </section>
      </div>

      <section class="patients-card patients-list" aria-labelledby="list-title">
        <h2 id="list-title">Listado de pacientes</h2>

        <div class="patients-field">
          <label for="search-input">Buscar</label>
          <input type="search" id="search-input" name="search" placeholder="Nombre, teléfono o correo">
        </div>

        <div class="patients-table-container">
          <table>
            <caption>Pacientes registrados</caption>
            <thead>
              <tr>
                <th scope="col">Paciente</th>
                <th scope="col">Edad</th>
                <th scope="col">Teléfono</th>
                <th scope="col">Correo</th>
                <th scope="col">Archivos</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody id="patients-table-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <article id="patient-sheet" class="patients-sheet"></article>
  </main>

  <footer class="patients-footer">
    <p>&copy; 2026 Medicitas</p>
  </footer>

  <script src="../js/compartido/tema.js" defer></script>
  <script src="../js/paginas/archivos.js" defer></script>
  <script src="../js/paginas/pacientes.js" defer></script>
</body>
</html>
