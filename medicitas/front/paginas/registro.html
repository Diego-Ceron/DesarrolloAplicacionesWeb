<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Medicitas</title>
  <link rel="stylesheet" href="../css/compartido/base.css">
  <link rel="stylesheet" href="../css/paginas/login.css">
</head>
<body>
  <main class="login">
    <section class="login-card" aria-labelledby="register-title">
      <header class="login-header">
        <h1 id="register-title">Crear cuenta</h1>
        <p>Regístrate para gestionar tus citas en Medicitas.</p>
      </header>

      <form id="register-form" class="login-form" action="#" method="post">
        <input type="hidden" name="action" value="register">

        <div class="login-field">
          <label for="full-name">Nombre completo</label>
          <input
            type="text"
            id="full-name"
            name="full_name"
            autocomplete="name"
            minlength="2"
            required
          >
        </div>

        <div class="login-field">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="login-field">
          <label for="phone">Teléfono</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            autocomplete="tel"
            inputmode="tel"
            minlength="10"
            pattern="[0-9()+\s-]{10,}"
            required
          >
        </div>

        <div class="login-field">
          <label for="birth-date">Fecha de nacimiento</label>
          <input
            type="date"
            id="birth-date"
            name="birth_date"
            autocomplete="bday"
            required
          >
        </div>

        <div class="login-field">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <div class="login-field">
          <label for="password-confirmation">Confirmar contraseña</label>
          <input
            type="password"
            id="password-confirmation"
            name="password_confirmation"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <p id="register-message" role="alert" hidden></p>

        <button type="submit">Crear cuenta</button>
      </form>

      <p class="login-link">
        ¿Ya tienes una cuenta?
        <a href="login.html">Inicia sesión</a>
      </p>
    </section>
  </main>

  <script src="../js/paginas/registro.js" defer></script>
</body>
</html>
